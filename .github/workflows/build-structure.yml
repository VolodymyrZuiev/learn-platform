name: Build structure.json

on:
  push:
    paths:
      - 'tutorials/**'
      - 'generate-structure.js'
      - '.github/workflows/build-structure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node -v
      - run: node generate-structure.js
      - name: Commit changes
        run: |
          if git status --porcelain | grep -q "structure.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add structure.json
            git commit -m "chore: update structure.json [skip ci]"
            git push
          else
            echo "No changes to commit."
